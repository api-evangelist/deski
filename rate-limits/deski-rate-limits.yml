note: >-
  An honest zero, and for a structural reason rather than an omission: DESKi publishes no
  HTTP API, so there is no request budget, no window, no burst allowance and no
  X-RateLimit-*/RateLimit-*/Retry-After response header to record. Scans and AI guidance
  are unmetered by design — every published plan says "unlimited users per licence" and
  unlimited usage per licence. No RateLimits pointer is wired into apis.yml, because
  asserting one would credit DESKi with a runtime rate-limit signal it does not ship.
