quota_analogues:
- mechanism: licence verification
  detail: >-
    The app must reach the licence service once every 30 days; failing that, access lapses
    until the licence is re-verified. This is the only recurring network-side constraint on
    use.
  source: https://www.heartfocus.ai/faq-heartfocus
- mechanism: licence count ceiling
  detail: >-
    Self-serve purchasing is capped at 5 licences (Small teams); 6+ requires the Enterprise
    quote path. See plans/deski-plans-pricing.yml.
  source: https://www.heartfocus.ai/pricing
- mechanism: per-view recording ceiling
  detail: >-
    An application-level constraint rather than a network one: only one clip per reference
    view can be recorded during acquisition, so a manual record can erase an automatic one.
  source: HeartFocus v1.3.1 user manual
- mechanism: DICOM transfer throughput
  detail: >-
    Not a limit DESKi imposes but a documented dependency: "The transfer duration depends on
    the data connection speed with the DICOM server. A 25 Mbps connection will lead to a
    1 minute transfer."
  source: HeartFocus v1.3.1 user manual
