note: >-
  This is a PRODUCT lifecycle, not an API lifecycle. DESKi ships a regulated mobile
  application; there is no API version, no versioned base path, no Sunset/Deprecation
  header surface and no API deprecation policy, because there is no API. What DESKi does
  publish — dated electronic instructions for use per software version, a stated product
  retirement date, licence renewal mechanics and FDA clearance dates — is captured below.
versioning:
  scheme: semver-ish product versions (major.minor.patch), e.g. v1.1.1, v1.2.1, v1.3.1
  applies_to: HeartFocus mobile application (iOS/iPadOS)
  api_versioning: none
  api_versioning_reason: no API is published
  policy_published: false
  note: >-
    Version history is only inferable from the dated user-manual (eIFU) list; there is no
    release-notes or changelog page. App Store release notes are the closest thing to a
    changelog and live on Apple's surface, not DESKi's.
