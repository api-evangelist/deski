availability:
  offline_operation: >-
    Scanning and AI guidance work entirely offline. Internet is required only to install or
    update the app, to verify the licence once every 30 days, and to send exams to a DICOM
    PACS.
  source: https://www.heartfocus.ai/faq-heartfocus
licensing:
  model: one licence per Butterfly probe serial number (HeartFocus), one licence per iPad
    device (HeartFocus Link)
  users_per_licence: unlimited
  trial: 30-day free trial
  renewal: >-
    Auto-renewal, managed in the HeartFocus Portal; the app surfaces expiry and
    auto-renewal warnings that direct the user to portal.heartfocus.ai.
  revocation_effect: licence lapse removes access to the app
sla:
  published: false
  note: >-
    No SLA document. The pricing page differentiates support by tier — "Basic security,
    compliance, support" on Small teams versus "Dedicated premium support / Faster response
    24/7 priority" on Enterprise — but attaches no numeric targets. The CVD policy is the
    only published response-time commitment (two business days to acknowledge).
