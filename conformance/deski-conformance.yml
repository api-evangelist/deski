note: >-
  DESKi is a regulated medical-device software company, not an API provider, so the
  standards it conforms to are imaging and regulatory standards rather than web-API ones.
  There is no OpenAPI, AsyncAPI, GraphQL SDL or OAuth surface to assert conformance
  against — every web-API entry below is recorded as not-applicable with the reason, so
  the absence is explicit instead of implied.
standards:
- id: dicom
  name: DICOM (Digital Imaging and Communications in Medicine)
  conforms: true
  role: Storage SCU (transfers exams to a customer-operated PACS)
  evidence: >-
    "Seamless PACS Integration — Secure DICOM transfer to PACS for direct upload and
    archival" (https://www.heartfocus.ai/product). The v1.3.1 user manual documents the
    in-app DICOM server form — server application entity title, client application entity
    title, server IP or hostname, server port, and an option to enable TLS — plus a
    connection test action and per-transfer audit logging.
  conformance_statement:
    published: false
    availability: on-request
    channel: support@deski.ai
    quote: >-
      "HeartFocus allows you to transfer exams to PACS servers using DICOM protocols. If
      needed, the DICOM conformance statement of HeartFocus can be obtained by contacting
      our support team via email at support@deski.ai."
    note: >-
      The DICOM conformance statement is the DICOM-world equivalent of an OpenAPI: it names
      the SOP classes, transfer syntaxes and AE roles an integrator needs. DESKi keeps it
      behind an email request, so the SOP classes it supports cannot be recorded here.
      Publishing it at a stable URL would make the only machine-facing surface DESKi ships
      independently readable.
- id: tls
  name: TLS transport encryption
  conforms: true
  evidence: >-
    TLS is a per-DICOM-server toggle in the app, and the manual states "It is strongly
    recommended to enable the TLS protocol on the DICOM server to secure the transmission
    of patient data." www.heartfocus.ai itself negotiates TLSv1.3 and sends HSTS with
    max-age=31536000 (see security/deski-domain-security.yml).
  caveat: >-
    TLS on the DICOM link is optional and can be disabled by the customer; the app warns
    but does not prevent it.
