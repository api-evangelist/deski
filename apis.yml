aid: deski
name: DESKi
description: 'DESKi is a French medical-device software company founded in 2016 in Bordeaux
  by brothers Bertrand and Olivier Moal, trading publicly under its HeartFocus brand. Its
  flagship product, HeartFocus, is an FDA-cleared AI cardiac imaging app that runs on iPhone
  and iPad with Butterfly Network iQ+ and iQ3 handheld ultrasound probes, giving any healthcare
  professional real-time probe guidance, automatic diagnostic-quality clip recording and live
  view validation across the 10 standard transthoracic echocardiographic views (PLAX, PSAX-AV,
  PSAX-MV, PSAX-PM, A4C, A5C, A2C, A3C, SC-4C, SC-IVC). A second product, HeartFocus Link,
  adds the same AI guidance to existing cart-based ultrasound systems from GE HealthCare,
  Philips, Siemens Healthineers, Mindray, FUJIFILM Sonosite, Samsung and Canon over a plain
  HDMI capture path, for education and training only. DESKi holds two FDA 510(k) clearances
  (K242807, 2025-04-04; K260780, 2026-06-03, product code QJU) and publishes a Coordinated
  Vulnerability Disclosure process, a HIPAA & HBNR applicability statement, per-probe list
  pricing and dated electronic instructions for use. Its only machine-facing integration
  surface is DICOM: exams are transferred from the mobile app to a customer-configured PACS
  server (server and client AE titles, host, port, optional TLS), and the DICOM conformance
  statement and CycloneDX SBOM are available only by emailing support. DESKi publishes no
  public REST or GraphQL API, no OpenAPI or AsyncAPI specification, no SDK, no CLI, no MCP
  server and no developer portal; portal.heartfocus.ai is a customer licence-management
  application, not a developer surface.'
