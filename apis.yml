x-coverage:
  state: none
  reason: no-developer-program
  detail: >-
    DESKi ships regulated end-user software, not a platform: HeartFocus is an FDA-cleared
    iPhone/iPad app whose only machine-facing interface is a DICOM push to a PACS the
    customer configures in-app, and the DICOM conformance statement that would describe it
    is available only by emailing support@deski.ai — /openapi.json, /graphql, /llms.txt and
    every /.well-known/* path return a real 404 on www.heartfocus.ai and deski.ai,
    api./developer./link.heartfocus.ai do not resolve in DNS, docs.heartfocus.ai is an S3
    bucket returning 403 AccessDenied, and portal.heartfocus.ai is a licence-management SPA
    that answers 200 with the same 467-byte HTML shell for every path probed.
